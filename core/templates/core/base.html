<!DOCTYPE html>
{% load static %}
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}ShopEase{% endblock %}</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
    }

    .modern-navbar {
      background: linear-gradient(120deg, #1f2933, #111827);
      background-size: 200% 200%;
      animation: gradientShift 12s ease infinite;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .nav-hover::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 10%;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.3s ease;
    }

    .nav-hover:hover::after {
      width: 80%;
    }

    .btn-gradient {
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: #fff;
      border: none;
    }

    footer {
      background: #020617;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg sticky-top modern-navbar">
  <div class="container">

    <a class="navbar-brand fw-bold fs-4 text-white" href="/">
      <i class="fas fa-store me-2"></i>ShopEase
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a href="{% url 'F_page' %}" class="nav-link nav-hover text-white">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle nav-hover text-white" data-bs-toggle="dropdown">Categories</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'J_page' %}">💎 Jewellery</a></li>
          </ul>
        </li>

      </ul>

      <!-- 🔍 SEARCH (FIXED & WORKING) -->
      <form method="POST" action="{% url 'search' %}" class="d-flex">
        {% csrf_token %}
        <input type="search"
               name="search"
               class="form-control form-control-sm rounded-pill me-2 bg-dark text-light border-0"
               placeholder="Search products..."
               required>
        <button class="btn btn-gradient btn-sm rounded-pill px-4">Search</button>
      </form>
      <!-- Cart & User -->
  <ul class="navbar-nav ms-3">
    <li class="nav-item position-relative me-3">
      <a class="nav-link text-white" href="{% url 'CARD' %}">
        <i class="fas fa-shopping-cart fs-5"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">2</span>
      </a>
    </li>

    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle text-white" href="" data-bs-toggle="dropdown">
        <i class="fas fa-user"></i> Account
      </a>
      <ul class="dropdown-menu dropdown-menu-end shadow-lg">
        <li><a href="{% url 'sign_in' %}" class="dropdown-item">Login</a></li>
        <li><a href="{% url 'sign_up' %}" class="dropdown-item">Register</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a href="{% url 'order_details' %}" class="dropdown-item">My Orders</a></li>
        <li><a href="{% url 'profile' %}" class="dropdown-item">Logout</a></li>
      </ul>
    </li>

    </div>
  </div>
</nav>

<main class="container py-5">
  {% block body %}{% endblock %}
</main>

<footer class="text-center text-secondary py-4">
  <p>&copy; 2025 ShopEase</p>
</footer>

</body>
</html>
